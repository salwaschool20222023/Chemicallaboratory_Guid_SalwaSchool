<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل المختبر الكيميائي — ثانوية سلوى للبنات</title>
<meta name="description" content="مجلة تفاعلية: دليل المختبر الكيميائي — ثانوية سلوى للبنات 2026/2027">
<meta name="theme-color" content="#1a1216">
<link rel="icon" href="assets/logo-school.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ شاشة الدخول (الغلاف) ============ -->
<section id="landing" aria-label="شاشة الدخول">
  <div class="landing-bg" style="background-image:url(assets/cover.jpg)"></div>
  <div class="landing-inner">
    <figure class="landing-card">
      <img src="assets/cover.jpg" alt="غلاف دليل المختبر الكيميائي — ثانوية سلوى للبنات">
      <button class="hotspot" id="enterHot" type="button" aria-label="اضغط هنا لفتح المجلة"></button>
    </figure>
    <button class="enter-btn" id="enterBtn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 3h9a3 3 0 0 1 3 3v15l-4-2-4 2-4-2V6a3 3 0 0 1 2-3zm0 2v12l2 1V6a1 1 0 0 0-1-1H5zm10 0H9v14l3-1.5 3 1.5V5z"/></svg>
      تصفّح المجلة
    </button>
  </div>
</section>

<!-- ============ العارض ============ -->
<main id="viewer" hidden>
  <header class="topbar">
    <button class="brand" id="homeBtn" type="button" aria-label="العودة إلى شاشة الدخول">
      <span class="logo-chip"><img src="assets/logo-moe.jpg" alt="وزارة التربية"></span>
      <span class="logo-chip"><img src="assets/logo-school.jpg" alt="ثانوية سلوى للبنات"></span>
      <span class="brand-text"><b id="brandTitle"></b><small id="brandSub"></small></span>
    </button>
    <div class="actions">
      <button class="tb" id="indexBtn" type="button" aria-label="الفهرس والبحث" title="الفهرس والبحث">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h10v2H4v-2z"/></svg><span>الفهرس</span>
      </button>
      <button class="tb" id="fsBtn" type="button" aria-label="ملء الشاشة" title="ملء الشاشة">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg><span>ملء الشاشة</span>
      </button>
      <a class="tb" id="pdfBtn" href="#" download aria-label="تحميل نسخة PDF" title="تحميل نسخة PDF">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M11 4h2v8.2l2.6-2.6L17 11l-5 5-5-5 1.4-1.4L11 12.2V4zM5 18h14v2H5v-2z"/></svg><span>PDF</span>
      </a>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="loading" id="loading"><span class="spinner"></span><span>جارٍ تجهيز المجلة…</span></div>
    <div id="book"></div>
  </div>

  <footer class="bottombar">
    <button class="nav" id="btnNext" type="button" aria-label="الصفحة التالية">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
      <span>التالي</span>
    </button>
    <div class="scrub">
      <input id="slider" type="range" min="0" max="55" value="0" step="1" dir="rtl" aria-label="التنقل بين الصفحات">
      <div class="scrub-label"><span id="pageLabel">الغلاف</span></div>
    </div>
    <button class="nav" id="btnPrev" type="button" aria-label="الصفحة السابقة">
      <span>السابق</span>
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4L15.2 12z"/></svg>
    </button>
  </footer>

  <!-- الفهرس -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="الفهرس">
    <div class="drawer-head">
      <h2>فهرس المجلة</h2>
      <button class="x" id="drawerClose" type="button" aria-label="إغلاق">✕</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.5 10.9l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="q" type="search" placeholder="ابحثي عن مادة… (مثال: حمض، زئبق، Na)" autocomplete="off">
    </label>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- التكبير -->
  <div class="zoom" id="zoom" hidden>
    <div class="zbar">
      <span class="ztitle" id="zTitle"></span>
      <div class="zbtns">
        <button type="button" id="zPrev" aria-label="الصفحة السابقة">›</button>
        <button type="button" id="zNext" aria-label="الصفحة التالية">‹</button>
        <button type="button" id="zOut" aria-label="تصغير">−</button>
        <button type="button" id="zIn" aria-label="تكبير">+</button>
        <button type="button" id="zFit" aria-label="ملاءمة">⤢</button>
        <button type="button" id="zClose" aria-label="إغلاق">✕</button>
      </div>
    </div>
    <div class="zscroll" id="zScroll"><img id="zImg" alt=""></div>
  </div>
</main>

<script src="js/page-flip.browser.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
